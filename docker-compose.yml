
services:
  mysql:
    image: mysql:8.4
    container_name: apartment-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: apartmentdb
    ports:
      - "3307:3306"
    volumes:
      - apartment-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: mjayashree08/apartment-maintenance-backend:latest
    container_name: apartment-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/apartmentdb
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    ports:
      - "8083:8083"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    image: mjayashree08/apartment-maintenance-frontend:latest
    container_name: apartment-frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  apartment-mysql-data: